name: Desktop signed release draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable desktop version X.Y.Z (new desktop-v tag)'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: desktop-signed-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: node --test scripts/desktop/*.test.mjs
      - name: Validate version before using signing credentials
        env:
          DESKTOP_VERSION: ${{ inputs.version }}
          DESKTOP_CONFIG: ${{ github.workspace }}/desktop-build-config.json
        run: node scripts/desktop/release.mjs prepare "$DESKTOP_VERSION" linux-x64

  signed-installers:
    needs: validate
    if: github.ref == 'refs/heads/master'
    environment: desktop-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x64, target: x86_64-unknown-linux-gnu }
          - { os: windows-2025, platform: windows-x64, target: x86_64-pc-windows-msvc }
          - { os: macos-15, platform: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: macos-x64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      DESKTOP_VERSION: ${{ inputs.version }}
      DESKTOP_PLATFORM: ${{ matrix.platform }}
      DESKTOP_TARGET: ${{ matrix.target }}
      DESKTOP_SIGNED: 'true'
      DESKTOP_CONFIG: ${{ github.workspace }}/desktop-build-config.json
      DESKTOP_OUTPUT: desktop-artifacts
      DESKTOP_BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Rust and dependencies
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$DESKTOP_TARGET"
          bun install --frozen-lockfile --ignore-scripts
      - name: Install Windows signing client
        if: runner.os == 'Windows'
        run: cargo install artifact-signing-cli --version 0.12.0 --locked
      - name: Native tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --lib --target "$DESKTOP_TARGET"
      - name: Build Linux payloads (signatures added during assembly)
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          node scripts/desktop/release.mjs prepare "$DESKTOP_VERSION" "$DESKTOP_PLATFORM"
          bun run tauri build --ci --target "$DESKTOP_TARGET" --config "$DESKTOP_CONFIG" -- --locked
          node scripts/desktop/release.mjs collect "$DESKTOP_VERSION" "$DESKTOP_PLATFORM" "$GITHUB_SHA"
      # TODO(handoff): Configure signing credentials and qualify installed sign-in/drop
      # on each OS before publication. Tracked by minion-meta proposal
      # 2026-10-19-hub-tauri-native-shell; unsigned qualification is not release proof.
      - name: Build and verify Apple signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bash scripts/desktop/build-macos.sh
      - name: Build and verify Windows trusted signature
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          WINDOWS_SIGNER_SUBJECT: ${{ secrets.WINDOWS_SIGNER_SUBJECT }}
        run: ./scripts/desktop/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.platform }}
          path: desktop-artifacts/
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: signed-installers
    if: github.ref == 'refs/heads/master'
    environment: desktop-signing
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DESKTOP_VERSION: ${{ inputs.version }}
      DESKTOP_INPUT: signed-inputs
      DESKTOP_OUTPUT: desktop-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: downloaded
      - name: Collect platform receipts from this run only
        run: |
          mkdir signed-inputs
          for platform in linux-x64 windows-x64 macos-arm64 macos-x64; do
            mv "downloaded/signed-$platform" "signed-inputs/$platform"
          done
          node scripts/desktop/release.mjs assemble "$DESKTOP_VERSION" "$GITHUB_SHA"
      - name: Sign Linux installers and complete checksum manifest
        env:
          DESKTOP_GPG_PRIVATE_KEY: ${{ secrets.DESKTOP_GPG_PRIVATE_KEY }}
          DESKTOP_GPG_PASSPHRASE: ${{ secrets.DESKTOP_GPG_PASSPHRASE }}
          DESKTOP_GPG_FINGERPRINT: ${{ secrets.DESKTOP_GPG_FINGERPRINT }}
        run: bash scripts/desktop/sign-linux.sh
      - name: Create draft with install links (never publish automatically)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-v$DESKTOP_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; use a new version instead of replacing assets.' >&2
            exit 1
          fi
          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq 'length')"
          if [[ "$refs" != 0 ]]; then
            echo 'Tag already exists; use a new version.' >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "Minion Hub desktop $DESKTOP_VERSION" \
            --notes-file desktop-release/release-notes.md desktop-release/*
