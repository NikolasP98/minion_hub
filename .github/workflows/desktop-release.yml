name: Desktop release with automatic updates

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable desktop version X.Y.Z (new desktop-v tag)'
        required: true
        type: string
      publish:
        description: 'Publish the unsigned preview now (otherwise create a draft)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: desktop-preview-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: node --test scripts/desktop/*.test.mjs
      - name: Validate desktop version
        env:
          DESKTOP_VERSION: ${{ inputs.version }}
          DESKTOP_CONFIG: ${{ github.workspace }}/desktop-build-config.json
        run: node scripts/desktop/release.mjs prepare "$DESKTOP_VERSION" linux-x64

  installers:
    needs: validate
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x64, target: x86_64-unknown-linux-gnu }
          - { os: windows-2025, platform: windows-x64, target: x86_64-pc-windows-msvc }
          - { os: macos-15, platform: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: macos-x64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      DESKTOP_VERSION: ${{ inputs.version }}
      DESKTOP_PLATFORM: ${{ matrix.platform }}
      DESKTOP_TARGET: ${{ matrix.target }}
      DESKTOP_CONFIG: ${{ github.workspace }}/desktop-build-config.json
      DESKTOP_OUTPUT: desktop-artifacts
      DESKTOP_BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Rust and dependencies
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$DESKTOP_TARGET"
          bun install --frozen-lockfile --ignore-scripts
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Check free updater integrity key is configured
        shell: bash
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Build bundled update window for native context and IPC tests
        run: bun run desktop:ui
      - name: Native tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --lib --target "$DESKTOP_TARGET"
      - name: Build unsigned Linux installers
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          node scripts/desktop/release.mjs prepare "$DESKTOP_VERSION" "$DESKTOP_PLATFORM"
          bun run tauri build --ci --no-sign --target "$DESKTOP_TARGET" --config "$DESKTOP_CONFIG" -- --locked
          for deb in "$DESKTOP_BUNDLE/deb/"*.deb; do
            bash scripts/desktop/verify-linux.sh "$deb"
          done
          node scripts/desktop/release.mjs collect "$DESKTOP_VERSION" "$DESKTOP_PLATFORM" "$GITHUB_SHA"
          node scripts/desktop/updates.mjs collect "$DESKTOP_VERSION" "$DESKTOP_PLATFORM" "$GITHUB_SHA"
      - name: Build unsigned macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/desktop/build-macos.sh
      - name: Build unsigned Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/desktop/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.platform }}
          path: desktop-artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: installers
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DESKTOP_VERSION: ${{ inputs.version }}
      DESKTOP_INPUT: unsigned-inputs
      DESKTOP_OUTPUT: desktop-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-*
          path: downloaded
      - name: Collect platform receipts from this run only
        run: |
          mkdir unsigned-inputs
          for platform in linux-x64 windows-x64 macos-arm64 macos-x64; do
            mv "downloaded/unsigned-$platform" "unsigned-inputs/$platform"
          done
          node scripts/desktop/release.mjs assemble "$DESKTOP_VERSION" "$GITHUB_SHA"
          node scripts/desktop/updates.mjs assemble "$DESKTOP_VERSION" "$GITHUB_SHA"
          node scripts/desktop/verify-release.mjs
      - name: Create unsigned preview with installation links
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          tag="desktop-v$DESKTOP_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; use a new version instead of replacing assets.' >&2
            exit 1
          fi
          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq 'length')"
          if [[ "$refs" != 0 ]]; then
            echo 'Tag already exists; use a new version.' >&2
            exit 1
          fi
          release_options=(--draft)
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            release_options=()
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            "${release_options[@]}" --prerelease --latest=false \
            --title "Minion Hub desktop $DESKTOP_VERSION — unsigned preview" \
            --notes-file desktop-release/release-notes.md desktop-release/*
      - name: Advance static update channel only after publication
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop/publish-feed.mjs
