name: Desktop qualification

on:
  pull_request:
    branches: [master]
    paths:
      - 'src-tauri/**'
      - 'scripts/desktop/**'
      - '.github/workflows/desktop-*.yml'
      - 'bun.lock'
      - 'package.json'

permissions:
  contents: read
concurrency:
  group: desktop-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: node --test scripts/desktop/*.test.mjs
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x64, target: x86_64-unknown-linux-gnu }
          - { os: windows-2025, platform: windows-x64, target: x86_64-pc-windows-msvc }
          - { os: macos-15, platform: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: macos-x64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DESKTOP_VERSION: 0.0.1
      DESKTOP_PLATFORM: ${{ matrix.platform }}
      DESKTOP_TARGET: ${{ matrix.target }}
      DESKTOP_SIGNED: 'false'
      DESKTOP_CONFIG: ${{ github.workspace }}/desktop-build-config.json
      DESKTOP_OUTPUT: desktop-artifacts
      DESKTOP_BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Rust and dependencies
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$DESKTOP_TARGET"
          bun install --frozen-lockfile --ignore-scripts
      - name: Native tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --lib --target "$DESKTOP_TARGET"
      - name: Build Linux qualification installers
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          node scripts/desktop/release.mjs prepare "$DESKTOP_VERSION" "$DESKTOP_PLATFORM"
          bun run tauri build --ci --no-sign --target "$DESKTOP_TARGET" --config "$DESKTOP_CONFIG" -- --locked
          for deb in "$DESKTOP_BUNDLE/deb/"*.deb; do
            bash scripts/desktop/verify-linux.sh "$deb"
          done
          node scripts/desktop/release.mjs collect "$DESKTOP_VERSION" "$DESKTOP_PLATFORM" "$GITHUB_SHA"
      - name: Build macOS qualification installer
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/desktop/build-macos.sh
      - name: Build Windows qualification installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/desktop/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-qualification-${{ matrix.platform }}
          path: desktop-artifacts/
          if-no-files-found: error
          retention-days: 7
