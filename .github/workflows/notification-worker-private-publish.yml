name: Notification worker private publication

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed Hub commit
        required: true
        type: string
      lock_sha256:
        description: Out-of-band reviewed bun.lock SHA-256 (sha256:...)
        required: true
        type: string

permissions:
  contents: read

jobs:
  protected-environment-preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require an existing reviewed protected environment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ENVIRONMENT_NAME: notification-worker-private-publication
        run: |
          set -eu
          response=$(gh api "repos/$REPOSITORY/environments/$ENVIRONMENT_NAME")
          gh api "repos/$REPOSITORY/branches/master/protection" >/dev/null
          required=$(jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' <<<"$response")
          branch_policy=$(jq -r '.deployment_branch_policy.protected_branches // false' <<<"$response")
          test "$required" -ge 1
          test "$branch_policy" = true

  disabled-systemd-gate:
    needs: protected-environment-preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Prove the absent activation marker prevents ExecStart
        run: scripts/ops/test-disabled-worker-systemd.sh

  build-and-publish:
    needs: disabled-systemd-gate
    runs-on: ubuntu-24.04
    environment: notification-worker-private-publication
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-publisher
          fetch-depth: 1
          persist-credentials: false

      - name: Validate dispatch and external approvals
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_REPOSITORY: ${{ vars.WORKER_ARTIFACT_EXPECTED_REPOSITORY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          LOCK_SHA256: ${{ inputs.lock_sha256 }}
          PUBLIC_PROVENANCE_APPROVED: ${{ vars.WORKER_ARTIFACT_PUBLIC_PROVENANCE_APPROVED }}
          LIVE_CONFIG_APPROVED: ${{ vars.WORKER_ARTIFACT_LIVE_CONFIG_APPROVED }}
        run: |
          node trusted-publisher/scripts/ops/private-worker-workflow-contract.mjs admit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source-checkout
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0

      - name: Export immutable tracked source
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          LOCK_SHA256: ${{ inputs.lock_sha256 }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source-checkout rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git -C trusted-publisher rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          source_tree=$(git -C source-checkout rev-parse HEAD^{tree})
          build_root="$RUNNER_TEMP/worker-build"
          test ! -e "$build_root"
          mkdir -m 0700 "$build_root"
          git -C source-checkout archive --format=tar HEAD | tar -xf - -C "$build_root"
          test ! -e "$build_root/.git"
          test "sha256:$(sha256sum "$build_root/bun.lock" | awk '{print $1}')" = "$LOCK_SHA256"
          node trusted-publisher/scripts/ops/private-worker-workflow-contract.mjs lock "$build_root/bun.lock"
          node trusted-publisher/scripts/ops/private-worker-workflow-contract.mjs inventory-create \
            "$build_root" "$RUNNER_TEMP/worker-source-inventory.json"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"
          echo "build_root=$build_root" >> "$GITHUB_OUTPUT"
        id: source

      - name: Build immutable disabled artifact
        env:
          BUILDER_IMAGE: node@sha256:b21fe589dfbe5cc39365d0544b9be3f1f33f55f3c86c87a76ff65a02f8f5848e
          DEPENDENCY_IMAGE: oven/bun@sha256:a6bf3b05eec36f7328f4416b2718d322b57252b1e0e4d91319bd1a7cae746745
          TRANSLATION_PLUGIN_SHA256: sha256:f206c76a6a590e7f17e2ba6f6cfdd22d56b1d96a2c8a812f2c5310316e733949
          SOURCE_SHA: ${{ inputs.source_sha }}
          LOCK_SHA256: ${{ inputs.lock_sha256 }}
          SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}
          BUILD_ROOT: ${{ steps.source.outputs.build_root }}
        run: |
          cd "$BUILD_ROOT"
          node_abi=$(docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges "$BUILDER_IMAGE" node -p 'process.versions.modules')
          node_version=$(docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges "$BUILDER_IMAGE" node -p 'process.version')
          test "$node_version" = v22.20.0
          export NODE_ABI="$node_abi"
          dependency_version=$(docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges "$DEPENDENCY_IMAGE" bun --version)
          test "$dependency_version" = 1.3.1
          export DEPENDENCY_VERSION="$dependency_version"
          test "sha256:$(sha256sum bun.lock | awk '{print $1}')" = "$LOCK_SHA256"
          mkdir -p .worker-bun-cache
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=512 --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$BUILD_ROOT:/work" -w /work \
            -e BUN_INSTALL_CACHE_DIR=/work/.worker-bun-cache \
            -e BUN_CONFIG_REGISTRY=https://registry.npmjs.org \
            -e DO_NOT_TRACK=1 -e BUN_TELEMETRY_DISABLED=1 \
            "$DEPENDENCY_IMAGE" sh -eu -c '
              bun install --frozen-lockfile --ignore-scripts
              rm -rf .worker-payload
              mkdir .worker-payload
              cp -R package.json bun.lock deps .worker-payload/
              cd .worker-payload
              bun install --frozen-lockfile --production --ignore-scripts'
          printf '%s  %s\n' "${TRANSLATION_PLUGIN_SHA256#sha256:}" \
            node_modules/@inlang/plugin-message-format/dist/index.js | sha256sum -c -
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=512 --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$BUILD_ROOT:/work" -w /work "$BUILDER_IMAGE" \
            node node_modules/@inlang/paraglide-js/bin/run.js compile \
              --project ./project.inlang --outdir ./src/lib/paraglide
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=512 \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e DESKTOP=1 -e MINION_WORKER_ARTIFACT_BUILD=1 \
            -e NOTIFICATION_BUILD_SHA="$SOURCE_SHA" -e PUBLIC_POSTHOG_KEY=disabled \
            -e PUBLIC_POSTHOG_HOST=https://127.0.0.1.invalid \
            -v "$BUILD_ROOT:/work" -w /work "$BUILDER_IMAGE" \
            node node_modules/vite/bin/vite.js build
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=512 \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e BUN_INSTALL_CACHE_DIR=/work/.worker-bun-cache \
            -e MINION_PINNED_BUILDER=1 -e GITHUB_REPOSITORY -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT -e BUILDER_IMAGE -e SOURCE_SHA -e SOURCE_TREE \
            -e WORKFLOW_COMMIT -e WORKFLOW_SOURCE_COMMIT -e NODE_ABI \
            -e BUILDER_IMAGE -e DEPENDENCY_IMAGE -e DEPENDENCY_VERSION \
            -e TRANSLATION_PLUGIN_SHA256 \
            -v "$BUILD_ROOT:/work" -w /work \
            "$DEPENDENCY_IMAGE" sh -eu -c '
              mkdir -p .worker-payload/ops
              cp -R build .worker-payload/
              cp deploy/systemd/minion-hub-notification-worker.service \
                deploy/systemd/minion-hub-notification-worker-launcher \
                scripts/ops/verify-disabled-worker.sh .worker-payload/ops/
              cd .worker-payload
              mv node_modules node_modules.links
              bun ../scripts/ops/materialize-worker-dependencies.mjs node_modules.links node_modules
              rm -rf node_modules.links
              cd ..
              bun scripts/ops/build-notification-worker-artifact.mjs \
              --output=notification-worker-artifact \
              --repository="$GITHUB_REPOSITORY" \
              --workflow=.github/workflows/notification-worker-private-publish.yml \
              --workflow-commit="$WORKFLOW_COMMIT" \
              --workflow-source-commit="$WORKFLOW_SOURCE_COMMIT" \
              --run-id="$GITHUB_RUN_ID" --run-attempt="$GITHUB_RUN_ATTEMPT" \
              --builder-image="$BUILDER_IMAGE" --dependency-image="$DEPENDENCY_IMAGE" \
              --translation-plugin-sha256="$TRANSLATION_PLUGIN_SHA256" \
              --bun-version="$DEPENDENCY_VERSION" \
              --target-node-version=v22.20.0 --target-node-abi="$NODE_ABI" \
              --source-commit="$SOURCE_SHA" --source-tree="$SOURCE_TREE" \
              --payload-dir=.worker-payload'
          rm -rf .worker-bun-cache .worker-payload

      - name: Prove exported tracked source bytes remain unchanged
        env:
          BUILD_ROOT: ${{ steps.source.outputs.build_root }}
        run: node trusted-publisher/scripts/ops/private-worker-workflow-contract.mjs inventory-verify "$BUILD_ROOT" "$RUNNER_TEMP/worker-source-inventory.json"

      - name: Stage no-follow publication subjects outside the build mount
        env:
          BUILD_ROOT: ${{ steps.source.outputs.build_root }}
        run: node trusted-publisher/scripts/ops/private-worker-workflow-contract.mjs stage "$BUILD_ROOT" "$GITHUB_WORKSPACE/publication-input"

      - name: Verify emitted artifact with trusted code in the pinned builder
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          LOCK_SHA256: ${{ inputs.lock_sha256 }}
          BUILDER_IMAGE: node@sha256:b21fe589dfbe5cc39365d0544b9be3f1f33f55f3c86c87a76ff65a02f8f5848e
          DEPENDENCY_IMAGE: oven/bun@sha256:a6bf3b05eec36f7328f4416b2718d322b57252b1e0e4d91319bd1a7cae746745
          VERIFIER_IMAGE: node@sha256:915acd9e9b885ead0c620e27e37c81b74c226e0e1c8177f37a60217b6eabb0d7
          TRANSLATION_PLUGIN_SHA256: sha256:f206c76a6a590e7f17e2ba6f6cfdd22d56b1d96a2c8a812f2c5310316e733949
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}
          BUILD_ROOT: ${{ steps.source.outputs.build_root }}
        run: |
          source_tree="${{ steps.source.outputs.source_tree }}"
          archive_sha="sha256:$(sha256sum publication-input/minion-hub-notification-worker.tar | awk '{print $1}')"
          manifest_sha=$(sha256sum publication-input/manifest.json | awk '{print "sha256:"$1}')
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            "$VERIFIER_IMAGE" sh -eu -c 'test "$(node -p process.version)" = v22.20.0; test "$(python3 --version)" = "Python 3.11.2"'
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=128 --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/publication-input:/work:ro" -v "$GITHUB_WORKSPACE/trusted-publisher:/trusted:ro" \
            -w /work "$VERIFIER_IMAGE" \
            node /trusted/scripts/ops/verify-notification-worker-artifact.mjs \
            --archive=/work/minion-hub-notification-worker.tar \
            --manifest=/work/manifest.json \
            --source-commit="$SOURCE_SHA" --source-tree="$source_tree" \
            --lock-sha256="$LOCK_SHA256" \
            --archive-sha256="$archive_sha" --repository="$GITHUB_REPOSITORY" \
            --manifest-sha256="$manifest_sha" --workflow-commit="$WORKFLOW_COMMIT" \
            --workflow-source-commit="$WORKFLOW_SOURCE_COMMIT" \
            --workflow=.github/workflows/notification-worker-private-publish.yml \
            --run-id="$GITHUB_RUN_ID" --run-attempt="$GITHUB_RUN_ATTEMPT" \
            --builder-image="$BUILDER_IMAGE" --dependency-image="$DEPENDENCY_IMAGE" \
            --translation-plugin-sha256="$TRANSLATION_PLUGIN_SHA256" \
            --target-os=linux --target-arch=x64

      - name: Verify workflow contract before publication
        run: node trusted-publisher/scripts/ops/private-worker-workflow-contract.mjs workflow trusted-publisher/.github/workflows/notification-worker-private-publish.yml

      - name: Root retriever authority and staging gate
        working-directory: trusted-publisher
        run: sudo --preserve-env=PATH node scripts/ops/test-root-private-worker-retriever.mjs

      - name: Attest archive and manifest
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            publication-input/minion-hub-notification-worker.tar
            publication-input/manifest.json

      - name: Retain offline provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: install -m 0400 "$BUNDLE_PATH" publication-input/attestation.jsonl

      - name: Verify build isolation and construct external authority
        id: authority
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          LOCK_SHA256: ${{ inputs.lock_sha256 }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
          EXPECTED_BUCKET_ID: ${{ vars.WORKER_ARTIFACT_B2_BUCKET_ID }}
          EXPECTED_BUCKET_NAME: ${{ vars.WORKER_ARTIFACT_B2_BUCKET_NAME }}
          EXPECTED_DENIAL_BUCKET_NAME: ${{ vars.WORKER_ARTIFACT_B2_DENIAL_BUCKET_NAME }}
          EXPECTED_REGION: ${{ vars.WORKER_ARTIFACT_B2_REGION }}
          EXPECTED_OWNER_ID: ${{ vars.WORKER_ARTIFACT_B2_OWNER_ID }}
          EXPECTED_API_ORIGIN: ${{ vars.WORKER_ARTIFACT_B2_API_ORIGIN }}
          EXPECTED_DOWNLOAD_ORIGIN: ${{ vars.WORKER_ARTIFACT_B2_DOWNLOAD_ORIGIN }}
          EXPECTED_S3_ORIGIN: ${{ vars.WORKER_ARTIFACT_B2_S3_ORIGIN }}
          EXPECTED_GH_VERSION: ${{ vars.WORKER_ARTIFACT_GH_VERSION }}
          EXPECTED_GH_SHA256: ${{ vars.WORKER_ARTIFACT_GH_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_BUCKET_ID"
          test -n "$EXPECTED_BUCKET_NAME"
          test -n "$EXPECTED_DENIAL_BUCKET_NAME"
          test "$EXPECTED_DENIAL_BUCKET_NAME" != "$EXPECTED_BUCKET_NAME"
          test -n "$EXPECTED_REGION"
          test -n "$EXPECTED_OWNER_ID"
          test -n "$EXPECTED_API_ORIGIN"
          test -n "$EXPECTED_DOWNLOAD_ORIGIN"
          test -n "$EXPECTED_S3_ORIGIN"
          test -n "$EXPECTED_GH_VERSION"
          test -n "$EXPECTED_GH_SHA256"
          test -z "$(docker ps -q)"
          gh_path=$(command -v gh)
          test "$(gh --version | awk 'NR == 1 { print $3 }')" = "$EXPECTED_GH_VERSION"
          node trusted-publisher/scripts/ops/private-worker-workflow-contract.mjs gh \
            "$gh_path" "$EXPECTED_GH_VERSION" "$EXPECTED_GH_SHA256"
          manifest=publication-input/manifest.json
          archive_sha="sha256:$(sha256sum publication-input/minion-hub-notification-worker.tar | awk '{print $1}')"
          source_tree="$SOURCE_TREE"
          manifest_sha="sha256:$(sha256sum "$manifest" | awk '{print $1}')"
          provenance_sha="sha256:$(sha256sum publication-input/attestation.jsonl | awk '{print $1}')"
          dependency_version=1.3.1
          node_version=v22.20.0
          node_abi=$(docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            node@sha256:b21fe589dfbe5cc39365d0544b9be3f1f33f55f3c86c87a76ff65a02f8f5848e \
            node -p 'process.versions.modules')
          jq -cn \
            --arg bucketId "$EXPECTED_BUCKET_ID" --arg bucketName "$EXPECTED_BUCKET_NAME" \
            --arg denialBucketName "$EXPECTED_DENIAL_BUCKET_NAME" \
            --arg region "$EXPECTED_REGION" --arg ownerId "$EXPECTED_OWNER_ID" \
            --arg apiOrigin "$EXPECTED_API_ORIGIN" --arg downloadOrigin "$EXPECTED_DOWNLOAD_ORIGIN" \
            --arg s3Origin "$EXPECTED_S3_ORIGIN" --arg archiveSha256 "$archive_sha" \
            --arg manifestSha256 "$manifest_sha" --arg provenanceSha256 "$provenance_sha" \
            --arg prefix "notification-worker/v1/$SOURCE_SHA/$archive_sha/" \
            --arg repository "$GITHUB_REPOSITORY" --arg sourceCommit "$SOURCE_SHA" \
            --arg sourceTree "$source_tree" --arg lockSha256 "$LOCK_SHA256" \
            --arg workflow '.github/workflows/notification-worker-private-publish.yml' \
            --arg workflowCommit "$WORKFLOW_COMMIT" --arg workflowSourceCommit "$WORKFLOW_SOURCE_COMMIT" --arg sourceRef "refs/heads/master" \
            --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg builderImage 'node@sha256:b21fe589dfbe5cc39365d0544b9be3f1f33f55f3c86c87a76ff65a02f8f5848e' \
            --arg dependencyImage 'oven/bun@sha256:a6bf3b05eec36f7328f4416b2718d322b57252b1e0e4d91319bd1a7cae746745' \
            --arg dependencyVersion "$dependency_version" --arg nodeVersion "$node_version" \
            --arg nodeAbi "$node_abi" \
            --arg translationPluginSha256 'sha256:f206c76a6a590e7f17e2ba6f6cfdd22d56b1d96a2c8a812f2c5310316e733949' \
            '{bucketId:$bucketId,bucketName:$bucketName,denialBucketName:$denialBucketName,prefix:$prefix,region:$region,ownerId:$ownerId,
              repository:$repository,sourceCommit:$sourceCommit,sourceTree:$sourceTree,
              lockSha256:$lockSha256,workflow:$workflow,workflowCommit:$workflowCommit,
              workflowSourceCommit:$workflowSourceCommit,sourceRef:$sourceRef,runId:$runId,runAttempt:$runAttempt,
              builderImage:$builderImage,dependencyImage:$dependencyImage,
              dependencyVersion:$dependencyVersion,nodeVersion:$nodeVersion,nodeAbi:$nodeAbi,
              translationPluginSha256:$translationPluginSha256,archiveSha256:$archiveSha256,
              manifestSha256:$manifestSha256,provenanceSha256:$provenanceSha256,
              apiOrigin:$apiOrigin,downloadOrigin:$downloadOrigin,s3Origin:$s3Origin}' > "$RUNNER_TEMP/worker-authority.json"
          chmod 0444 "$RUNNER_TEMP/worker-authority.json"

      - name: Publish exact versions and the receipt last
        env:
          WORKER_ARTIFACT_B2_PUBLISHER_KEY_ID: ${{ secrets.WORKER_ARTIFACT_B2_PUBLISHER_KEY_ID }}
          WORKER_ARTIFACT_B2_PUBLISHER_APPLICATION_KEY: ${{ secrets.WORKER_ARTIFACT_B2_PUBLISHER_APPLICATION_KEY }}
          EXPECTED_GH_VERSION: ${{ vars.WORKER_ARTIFACT_GH_VERSION }}
          EXPECTED_GH_SHA256: ${{ vars.WORKER_ARTIFACT_GH_SHA256 }}
          PUBLISHER_IMAGE: node@sha256:915acd9e9b885ead0c620e27e37c81b74c226e0e1c8177f37a60217b6eabb0d7
          PUBLISHER_TRUSTED_DIR: ${{ github.workspace }}/trusted-publisher
          PUBLISHER_AUTHORITY_FILE: ${{ runner.temp }}/worker-authority.json
          PUBLISHER_ARTIFACT_DIR: ${{ github.workspace }}/publication-input
        run: |
          set -euo pipefail
          test -n "$WORKER_ARTIFACT_B2_PUBLISHER_KEY_ID"
          test -n "$WORKER_ARTIFACT_B2_PUBLISHER_APPLICATION_KEY"
          export PUBLISHER_GH_PATH
          PUBLISHER_GH_PATH=$(command -v gh)
          test "$(gh --version | awk 'NR == 1 { print $3 }')" = "$EXPECTED_GH_VERSION"
          node trusted-publisher/scripts/ops/private-worker-workflow-contract.mjs gh \
            "$PUBLISHER_GH_PATH" "$EXPECTED_GH_VERSION" "$EXPECTED_GH_SHA256"
          trusted-publisher/scripts/ops/run-private-worker-publisher-container.sh
