name: JEV shadow qualification
on:
  pull_request:
    paths: ['scripts/jev-shadow/**', '.github/workflows/jev-shadow.yml']
  workflow_dispatch:
jobs:
  shadow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minion_qc_jev_ci
        ports: ['54422:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: scripts/jev-shadow
      - run: node --test *.test.mjs
        working-directory: scripts/jev-shadow
        env:
          JEV_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54422/minion_qc_jev_ci
