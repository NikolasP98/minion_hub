name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # No PUBLIC_DEFAULT_ORG_SLUG override here: agent-org.ts derives its org
      # regex from it, and tests expect the .env.example default (faces-sculptors).
      PUBLIC_POSTHOG_HOST: https://posthog.invalid
      PUBLIC_POSTHOG_KEY: ci
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: ui-audit-inventory resolves its pinned baseline commit.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Svelte environment and translations
        run: |
          cp .env.example .env
          bun run i18n:compile
          bunx svelte-kit sync

      - name: Unit tests
        # --retry=2 absorbs known parallel-load flakes (timeouts that pass in isolation)
        run: bunx vitest run --retry=2

      - name: Architecture recon index
        run: bun run test:architecture-recon

  crm-deposit-rule-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_deposit_rule_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PUBLIC_POSTHOG_HOST: https://posthog.invalid
      PUBLIC_POSTHOG_KEY: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Svelte environment and translations
        run: |
          cp .env.example .env
          bun run i18n:compile
          bunx svelte-kit sync

      # Job-scoped, not a blanket CI env var: SUPABASE_DB_URL is also read by other
      # *.sql.integration.test.ts / *.service.test.ts files that expect the full prod
      # schema (hub-supabase-schema-not-reproducible.md), which this bare service lacks.
      # This step only runs the deposit-rule file, so that mismatch can't leak in.
      - name: Real-PostgreSQL deposit-rule classifier suite
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/crm_deposit_rule_test
          REQUIRE_DEPOSIT_RULE_POSTGRES: '1'
        run: bunx vitest run --retry=2 src/server/services/crm-deposit-rule.sql.integration.test.ts

      - name: Real-PostgreSQL CRM pagination suite
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/crm_deposit_rule_test
          REQUIRE_CRM_CONTACTS_POSTGRES: '1'
          REQUIRE_CRM_FUNNEL_PARITY_POSTGRES: '1'
          REQUIRE_CRM_ACTIVITY_ROLLUP_POSTGRES: '1'
        run: |
          bunx vitest run --retry=2 \
            src/server/services/crm-contact-activity-rollup.sql.integration.test.ts \
            src/server/services/crm-contacts.sql.integration.test.ts \
            src/server/services/crm-funnel-parity.sql.integration.test.ts

  # Isolated from `crm-deposit-rule-postgres` on purpose: that job's Postgres is a
  # BARE service container, while this one is seeded with a CI-only reproduction of
  # the prod CRM schema (organizations + crm_activities + app_ledger + org-GUC RLS).
  # `SUPABASE_DB_URL` is read by every *.sql.integration.test.ts / *.service.test.ts
  # in the repo, and most of them expect one shape or the other — sharing a single
  # job would leak the wrong assumption into whichever set does not match. Each job
  # therefore names its files explicitly and scopes the URL to its own steps.
  crm-funnel-concurrent-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_funnel_concurrent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PUBLIC_POSTHOG_HOST: https://posthog.invalid
      PUBLIC_POSTHOG_KEY: ci
      # Single source for the connection string every step below shares.
      FUNNEL_DB_URL: postgresql://postgres:postgres@localhost:5432/crm_funnel_concurrent_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Svelte environment and translations
        run: |
          cp .env.example .env
          bun run i18n:compile
          bunx svelte-kit sync

      # The fixture ends with executable catalog assertions (RLS enabled + forced,
      # exactly one `*_org_guc` policy per table with the recorded roles/cmd/
      # predicates, app_ledger's exact privilege set — no more and no fewer than
      # production's recorded grant — seed org row) followed by column-shape
      # assertions over information_schema.columns — type, nullability and
      # default for every column Slice 0 actually extracted, including the
      # deliberate `crm_contacts.id` NOT NULL vs `crm_activities.id` nullable
      # asymmetry. With ON_ERROR_STOP those assertions ARE this step: a fixture
      # that drifts from the recorded prod snapshot (in either direction — a
      # LOOSER or a STRICTER shape) fails here rather than producing a green run
      # against a schema contract production does not have.
      - name: Apply CI-only CRM schema fixture
        run: psql -v ON_ERROR_STOP=1 "$FUNNEL_DB_URL" -f supabase/ci-fixtures/crm-funnel-concurrent.sql

      # Behavioural counterpart to the catalog assertions: proves rows really are
      # invisible ACROSS orgs under `app_ledger` — and, first, that they are
      # visible WITHIN their own org. The positive half is what keeps the check
      # from passing vacuously: "no rows" is equally what a mistyped id, an
      # unseeded table or a missing SELECT grant would produce, so an
      # invisibility-only assertion cannot tell RLS working from RLS untested.
      # Both rows are inserted BY `app_ledger` itself, not by the owner
      # connection: that exercises the INSERT privilege and the policies'
      # WITH CHECK arm, so the fixture's granted privileges are proved usable
      # rather than merely present in the catalog.
      # One explicit transaction because `set_config(..., true)` and
      # `set local role` are transaction-local — as separate autocommit
      # statements the GUC would reset between them and the check would be
      # vacuous. The rollback leaves the database exactly as the fixture left it.
      - name: Cross-org RLS control (own org visible, foreign org invisible)
        run: |
          psql -v ON_ERROR_STOP=1 "$FUNNEL_DB_URL" <<'SQL'
          begin;
          set local role app_ledger;
          select set_config('app.current_org_id', '00000000-0000-0000-0000-000000000001', true);
          insert into crm_contacts (id, org_id, source, custom_fields)
          values ('00000000-0000-0000-0000-000000000010',
                  '00000000-0000-0000-0000-000000000001', 'manual', '{}');
          insert into crm_activities (id, org_id, contact_id, kind)
          values ('00000000-0000-0000-0000-000000000011',
                  '00000000-0000-0000-0000-000000000001',
                  '00000000-0000-0000-0000-000000000010', 'manual');
          do $$
          begin
            if not exists (select 1 from crm_contacts where id = '00000000-0000-0000-0000-000000000010')
               or not exists (select 1 from crm_activities where id = '00000000-0000-0000-0000-000000000011') then
              raise exception
                'own-org CRM rows are NOT visible under app_ledger — the cross-org check below would pass for the wrong reason';
            end if;
          end $$;
          select set_config('app.current_org_id', '00000000-0000-0000-0000-000000000002', true);
          do $$
          begin
            if exists (select 1 from crm_contacts where id = '00000000-0000-0000-0000-000000000010')
               or exists (select 1 from crm_activities where id = '00000000-0000-0000-0000-000000000011') then
              raise exception 'cross-org CRM rows are visible under app_ledger';
            end if;
          end $$;
          rollback;
          SQL

      # A JSON report, not just the exit code: `describe.runIf(...)` makes "0 failed"
      # equally true when nothing ran, so the gate asserts all seven PASSED and zero
      # PENDING (3 base-funnel tests + 4 coordinator-lock tests — update this count
      # if tests are added to or removed from the registered file below).
      # REQUIRE_CRM_FUNNEL_CONCURRENT_POSTGRES additionally makes the suite throw if
      # the URL ever goes missing, so a broken service container cannot degrade this
      # job into a silent skip.
      - name: Real-PostgreSQL funnel concurrency suite
        env:
          # Reuse the job-level value rather than a second literal: two copies of
          # the same connection string can drift, and a drifted copy here would
          # point the suite at a database the fixture steps above never seeded.
          SUPABASE_DB_URL: ${{ env.FUNNEL_DB_URL }}
          REQUIRE_CRM_FUNNEL_CONCURRENT_POSTGRES: '1'
        run: |
          mkdir -p test-results
          bunx vitest run --retry=2 \
            --reporter=default --reporter=json \
            --outputFile.json=test-results/crm-funnel-concurrent.json \
            src/server/services/crm-funnel.concurrent.integration.test.ts

      - name: Assert the suite actually ran (7 passed, 0 skipped)
        if: always()
        run: |
          test -f test-results/crm-funnel-concurrent.json \
            || { echo 'no vitest JSON report — the suite never produced one'; exit 1; }
          jq -e '.numTotalTests == 7 and .numPassedTests == 7
                 and .numFailedTests == 0 and .numPendingTests == 0' \
            test-results/crm-funnel-concurrent.json > /dev/null \
            || { jq '{numTotalTests, numPassedTests, numFailedTests, numPendingTests}' \
                   test-results/crm-funnel-concurrent.json; exit 1; }

      # Raw job logs expire; the artifact is the durable pass/fail evidence.
      - name: Upload concurrency-suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-funnel-concurrent-report
          path: test-results/crm-funnel-concurrent.json
          if-no-files-found: warn

  jobs-stock-finance-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Frozen install and native fixture prerequisites
        run: |
          bun install --frozen-lockfile
          bun run i18n:compile
          bunx svelte-kit sync
      # The disposable guard verifies inet_server_addr(), not just the client URL.
      # Host networking keeps PostgreSQL's observed endpoint on loopback as well.
      - name: Start the pinned disposable PostgreSQL on loopback
        env:
          PGPASSWORD: disposable-ci-only
        run: |
          docker run --detach --rm --name minion-jobs-postgres --network host \
            -e POSTGRES_USER=minion_qc -e POSTGRES_PASSWORD=disposable-ci-only \
            -e POSTGRES_DB=minion_qc_corpus \
            pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff \
            postgres -c listen_addresses=127.0.0.1 -c port=55461
          for attempt in {1..30}; do
            if psql -h 127.0.0.1 -p 55461 -U minion_qc -d minion_qc_corpus \
              -Atc 'select 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs minion-jobs-postgres
          exit 1
      - name: Mark only the disposable service database and prepare restricted roles
        env:
          PGPASSWORD: disposable-ci-only
        run: |
          psql -h 127.0.0.1 -p 55461 -U minion_qc -d minion_qc_corpus -v ON_ERROR_STOP=1 <<'SQL'
          COMMENT ON DATABASE minion_qc_corpus IS 'minion-360-disposable:v1';
          CREATE ROLE app_ledger NOLOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE anon NOLOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE authenticated NOLOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS;
          SQL
      - name: Exact jobs, stock, effect-page, finance and corpus SQL lane
        run: |
          mkdir -p test-results
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            MINION_QC_DISPOSABLE=1 REQUIRE_JOBS_POSTGRES=1 \
            MINION_QC_DATABASE_URL=postgres://minion_qc:disposable-ci-only@127.0.0.1:55461/minion_qc_corpus \
            node node_modules/vitest/vitest.mjs run --config vitest.jobs-postgres.config.ts \
              --reporter=default --reporter=json --outputFile.json=test-results/jobs-postgres.json
      - name: Refuse missing, empty, failed or skipped native suites
        if: always()
        run: bun scripts/qc/jobs-postgres-contract.ts test-results/jobs-postgres.json
      - name: Retain exact native assertion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-stock-finance-postgres
          path: test-results/jobs-postgres.json
          if-no-files-found: error

      - name: Stop only the owned disposable PostgreSQL
        if: always()
        run: docker rm --force --volumes minion-jobs-postgres

  check-and-build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_DEFAULT_ORG_SLUG: ci
      PUBLIC_POSTHOG_HOST: https://posthog.invalid
      PUBLIC_POSTHOG_KEY: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Svelte environment and translations
        run: |
          cp .env.example .env
          bun run i18n:compile

      - name: Svelte check + typecheck
        run: bun run check

      - name: Design token integrity
        run: bun run lint:tokens:ci

      - name: Design lint ratchet (changed files)
        env:
          DESIGN_LINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$DESIGN_LINT_BASE_REF" || "$DESIGN_LINT_BASE_REF" =~ ^0+$ ]]; then
            export DESIGN_LINT_BASE_REF="$(git rev-parse HEAD^)"
          fi
          bun run lint:design:ci

      - name: Prettier check (changed files)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -d '' files < <(git diff -z --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- \
            '*.css' '*.js' '*.json' '*.md' '*.svelte' '*.ts' '*.yaml' '*.yml')
          if (( ${#files[@]} > 0 )); then
            bunx prettier --plugin=prettier-plugin-svelte --check -- "${files[@]}"
          fi

      - name: Build
        run: bun run build
