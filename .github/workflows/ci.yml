name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # No PUBLIC_DEFAULT_ORG_SLUG override here: agent-org.ts derives its org
      # regex from it, and tests expect the .env.example default (faces-sculptors).
      PUBLIC_POSTHOG_HOST: https://posthog.invalid
      PUBLIC_POSTHOG_KEY: ci
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: ui-audit-inventory resolves its pinned baseline commit.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Svelte environment and translations
        run: |
          cp .env.example .env
          bun run i18n:compile
          bunx svelte-kit sync

      - name: Unit tests
        # --retry=2 absorbs known parallel-load flakes (timeouts that pass in isolation)
        run: bunx vitest run --retry=2

      - name: Architecture recon index
        run: bun run test:architecture-recon

      # DB-free filesystem check on the ACTUAL committed baseline (spec §7 S4
      # deliverable 3). The pure-logic cases live in check-baseline.test.ts,
      # already covered by "Unit tests" above (scripts/**/*.test.ts) — this
      # step is the one that runs against the real supabase/qa/baseline/*.
      - name: QA baseline sanity check
        run: bun run qa:check-baseline

  # pull_request only: needs the PR's base sha + labels from the event payload,
  # neither of which exist on a push build. No `bun install` — the script has
  # zero third-party imports (node:fs/child_process/path/url only).
  migration-seed-pairing:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff's base commit must be reachable locally.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Migration/seed pairing check (spec §6 rule 1)
        run: bun scripts/qa/check-migration-seed-pairing.ts

  crm-deposit-rule-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_deposit_rule_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PUBLIC_POSTHOG_HOST: https://posthog.invalid
      PUBLIC_POSTHOG_KEY: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Svelte environment and translations
        run: |
          cp .env.example .env
          bun run i18n:compile
          bunx svelte-kit sync

      # Job-scoped, not a blanket CI env var: SUPABASE_DB_URL is also read by other
      # *.sql.integration.test.ts / *.service.test.ts files that expect the full prod
      # schema (hub-supabase-schema-not-reproducible.md), which this bare service lacks.
      # This step only runs the deposit-rule file, so that mismatch can't leak in.
      - name: Real-PostgreSQL deposit-rule classifier suite
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/crm_deposit_rule_test
          REQUIRE_DEPOSIT_RULE_POSTGRES: '1'
        run: bunx vitest run --retry=2 src/server/services/crm-deposit-rule.sql.integration.test.ts

      - name: Real-PostgreSQL CRM pagination suite
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/crm_deposit_rule_test
          REQUIRE_CRM_CONTACTS_POSTGRES: '1'
          REQUIRE_CRM_FUNNEL_PARITY_POSTGRES: '1'
          REQUIRE_CRM_ACTIVITY_ROLLUP_POSTGRES: '1'
        run: |
          bunx vitest run --retry=2 \
            src/server/services/crm-contact-activity-rollup.sql.integration.test.ts \
            src/server/services/crm-contacts.sql.integration.test.ts \
            src/server/services/crm-funnel-parity.sql.integration.test.ts

  # Isolated from `crm-deposit-rule-postgres` on purpose: that job's Postgres is a
  # BARE service container, while this one is seeded with a CI-only reproduction of
  # the prod CRM schema (organizations + crm_activities + app_ledger + org-GUC RLS).
  # `SUPABASE_DB_URL` is read by every *.sql.integration.test.ts / *.service.test.ts
  # in the repo, and most of them expect one shape or the other — sharing a single
  # job would leak the wrong assumption into whichever set does not match. Each job
  # therefore names its files explicitly and scopes the URL to its own steps.
  crm-funnel-concurrent-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_funnel_concurrent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PUBLIC_POSTHOG_HOST: https://posthog.invalid
      PUBLIC_POSTHOG_KEY: ci
      # Single source for the connection string every step below shares.
      FUNNEL_DB_URL: postgresql://postgres:postgres@localhost:5432/crm_funnel_concurrent_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Svelte environment and translations
        run: |
          cp .env.example .env
          bun run i18n:compile
          bunx svelte-kit sync

      # The fixture ends with executable catalog assertions (RLS enabled + forced,
      # exactly one `*_org_guc` policy per table with the recorded roles/cmd/
      # predicates, app_ledger grants, seed org row) followed by column-shape
      # assertions over information_schema.columns — type, nullability and
      # default for every column Slice 0 actually extracted, including the
      # deliberate `crm_contacts.id` NOT NULL vs `crm_activities.id` nullable
      # asymmetry. With ON_ERROR_STOP those assertions ARE this step: a fixture
      # that drifts from the recorded prod snapshot (in either direction — a
      # LOOSER or a STRICTER shape) fails here rather than producing a green run
      # against a schema contract production does not have.
      - name: Apply CI-only CRM schema fixture
        run: psql -v ON_ERROR_STOP=1 "$FUNNEL_DB_URL" -f supabase/ci-fixtures/crm-funnel-concurrent.sql

      # Behavioural counterpart to the catalog assertions: proves rows really are
      # invisible across orgs under `app_ledger`, not merely that the policies are
      # spelled correctly. One explicit transaction because `set_config(..., true)`
      # and `set local role` are transaction-local — as separate autocommit
      # statements the GUC would reset between them and the check would be vacuous.
      - name: Cross-org RLS negative control
        run: |
          psql -v ON_ERROR_STOP=1 "$FUNNEL_DB_URL" <<'SQL'
          begin;
          set local role app_ledger;
          select set_config('app.current_org_id', '00000000-0000-0000-0000-000000000001', true);
          insert into crm_contacts (id, org_id, source, custom_fields)
          values ('00000000-0000-0000-0000-000000000010',
                  '00000000-0000-0000-0000-000000000001', 'manual', '{}');
          insert into crm_activities (id, org_id, contact_id, kind)
          values ('00000000-0000-0000-0000-000000000011',
                  '00000000-0000-0000-0000-000000000001',
                  '00000000-0000-0000-0000-000000000010', 'manual');
          select set_config('app.current_org_id', '00000000-0000-0000-0000-000000000002', true);
          do $$
          begin
            if exists (select 1 from crm_contacts where id = '00000000-0000-0000-0000-000000000010')
               or exists (select 1 from crm_activities where id = '00000000-0000-0000-0000-000000000011') then
              raise exception 'cross-org CRM rows are visible under app_ledger';
            end if;
          end $$;
          rollback;
          SQL

      # A JSON report, not just the exit code: `describe.runIf(...)` makes "0 failed"
      # equally true when nothing ran, so the gate asserts all seven PASSED and zero
      # PENDING (3 base-funnel tests + 4 coordinator-lock tests — update this count
      # if tests are added to or removed from the registered file below).
      # REQUIRE_CRM_FUNNEL_CONCURRENT_POSTGRES additionally makes the suite throw if
      # the URL ever goes missing, so a broken service container cannot degrade this
      # job into a silent skip.
      - name: Real-PostgreSQL funnel concurrency suite
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/crm_funnel_concurrent_test
          REQUIRE_CRM_FUNNEL_CONCURRENT_POSTGRES: '1'
        run: |
          mkdir -p test-results
          bunx vitest run --retry=2 \
            --reporter=default --reporter=json \
            --outputFile.json=test-results/crm-funnel-concurrent.json \
            src/server/services/crm-funnel.concurrent.integration.test.ts

      - name: Assert the suite actually ran (7 passed, 0 skipped)
        if: always()
        run: |
          test -f test-results/crm-funnel-concurrent.json \
            || { echo 'no vitest JSON report — the suite never produced one'; exit 1; }
          jq -e '.numTotalTests == 7 and .numPassedTests == 7
                 and .numFailedTests == 0 and .numPendingTests == 0' \
            test-results/crm-funnel-concurrent.json > /dev/null \
            || { jq '{numTotalTests, numPassedTests, numFailedTests, numPendingTests}' \
                   test-results/crm-funnel-concurrent.json; exit 1; }

      # Raw job logs expire; the artifact is the durable pass/fail evidence.
      - name: Upload concurrency-suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-funnel-concurrent-report
          path: test-results/crm-funnel-concurrent.json
          if-no-files-found: warn

  jobs-stock-finance-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Frozen install and native fixture prerequisites
        run: |
          bun install --frozen-lockfile
          bun run i18n:compile
          bunx svelte-kit sync
      # The disposable guard verifies inet_server_addr(), not just the client URL.
      # Host networking keeps PostgreSQL's observed endpoint on loopback as well.
      - name: Start the pinned disposable PostgreSQL on loopback
        env:
          PGPASSWORD: disposable-ci-only
        run: |
          docker run --detach --rm --name minion-jobs-postgres --network host \
            -e POSTGRES_USER=minion_qc -e POSTGRES_PASSWORD=disposable-ci-only \
            -e POSTGRES_DB=minion_qc_corpus \
            pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff \
            postgres -c listen_addresses=127.0.0.1 -c port=55461
          for attempt in {1..30}; do
            if psql -h 127.0.0.1 -p 55461 -U minion_qc -d minion_qc_corpus \
              -Atc 'select 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs minion-jobs-postgres
          exit 1
      - name: Mark only the disposable service database and prepare restricted roles
        env:
          PGPASSWORD: disposable-ci-only
        run: |
          psql -h 127.0.0.1 -p 55461 -U minion_qc -d minion_qc_corpus -v ON_ERROR_STOP=1 <<'SQL'
          COMMENT ON DATABASE minion_qc_corpus IS 'minion-360-disposable:v1';
          CREATE ROLE app_ledger NOLOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE anon NOLOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE authenticated NOLOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS;
          SQL
      - name: Exact jobs, stock, effect-page, finance and corpus SQL lane
        run: |
          mkdir -p test-results
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            MINION_QC_DISPOSABLE=1 REQUIRE_JOBS_POSTGRES=1 \
            MINION_QC_DATABASE_URL=postgres://minion_qc:disposable-ci-only@127.0.0.1:55461/minion_qc_corpus \
            node node_modules/vitest/vitest.mjs run --config vitest.jobs-postgres.config.ts \
              --reporter=default --reporter=json --outputFile.json=test-results/jobs-postgres.json
      - name: Refuse missing, empty, failed or skipped native suites
        if: always()
        run: bun scripts/qc/jobs-postgres-contract.ts test-results/jobs-postgres.json
      - name: Retain exact native assertion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-stock-finance-postgres
          path: test-results/jobs-postgres.json
          if-no-files-found: error

      - name: Exact attachment authority and lifecycle PostgreSQL lane
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            MINION_QC_DISPOSABLE=1 \
            MINION_QC_DATABASE_URL=postgres://minion_qc:disposable-ci-only@127.0.0.1:55461/minion_qc_corpus \
            node node_modules/vitest/vitest.mjs run --config vitest.attachments-postgres.config.ts \
              --reporter=default --reporter=json --outputFile.json=test-results/attachments-postgres.json
      - name: Refuse incomplete attachment native reports
        if: always()
        run: bun scripts/qc/attachments-postgres-contract.ts test-results/attachments-postgres.json
      - name: Retain attachment native assertion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachments-postgres
          path: test-results/attachments-postgres.json
          if-no-files-found: error

      - name: Exact assistant principal PostgreSQL lane
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            MINION_QC_DISPOSABLE=1 \
            MINION_QC_DATABASE_URL=postgres://minion_qc:disposable-ci-only@127.0.0.1:55461/minion_qc_corpus \
            node node_modules/vitest/vitest.mjs run --config vitest.principal-postgres.config.ts \
              --reporter=default --reporter=json --outputFile.json=test-results/principal-postgres.json
      - name: Refuse incomplete principal native reports
        if: always()
        run: bun scripts/qc/principal-postgres-contract.ts test-results/principal-postgres.json
      - name: Retain principal native assertion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: principal-postgres
          path: test-results/principal-postgres.json
          if-no-files-found: error

      - name: Stop only the owned disposable PostgreSQL
        if: always()
        run: docker rm --force --volumes minion-jobs-postgres

  # Spec: specs/2026-09-16-hub-local-qa-stack-spec.md §7 S4, §9. Boots the real
  # local Supabase stack, bootstraps from the committed baseline with the
  # PRODUCTION migration runner (scripts/db-migrate.ts, unchanged), seeds,
  # runs the seed contract test and the Drizzle/DB drift check, then builds
  # and smoke-tests the app against it. A red job means "this PR's migration
  # or seed change broke the environment every other developer uses" — see
  # spec §6 rule 2.
  qa-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_POSTHOG_HOST: https://posthog.invalid
      PUBLIC_POSTHOG_KEY: ci
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54422/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Svelte environment and translations
        run: |
          cp .env.example .env
          bun run i18n:compile
          bunx svelte-kit sync

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      # config.toml already disables studio/realtime/storage/inbucket/analytics/
      # edge_runtime; -x is repeated here for older-CLI safety per spec §2.
      # NEVER add db/kong/rest/auth to this list — those are the services this
      # whole job exists to exercise.
      - name: Start the local Supabase stack (QA project)
        run: |
          supabase start --workdir . \
            -x studio,realtime,storage,imgproxy,inbucket,analytics,edge-runtime,vector,meta

      - name: Bootstrap the QA database (roles, baseline restore, production migration runner)
        run: |
          bun scripts/qa/db-bootstrap.ts --json | tee qa-bootstrap.json
          cat > /tmp/assert-bootstrap.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          const lines = readFileSync('qa-bootstrap.json', 'utf8').trim().split('\n');
          const summary = JSON.parse(lines.at(-1));
          if (!summary.ok) {
            console.error('db-bootstrap.ts reported failure:', summary);
            process.exit(1);
          }
          if (summary.pendingMigrations !== 0) {
            console.error(`expected 0 pending migrations, got ${summary.pendingMigrations}`);
            process.exit(1);
          }
          console.log('db-bootstrap.ts summary OK:', summary);
          EOF
          bun /tmp/assert-bootstrap.mjs
          rm -f qa-bootstrap.json /tmp/assert-bootstrap.mjs

      # Independent of db-bootstrap.ts's own internal tripwire (see its
      # baseline.json comparison): queries the ledger directly and diffs it
      # against the migration files newer than the baseline on disk. Proves
      # "0 pending" and "applied exactly the expected set" are the same thing.
      - name: Assert the runner applied exactly the migrations newer than the baseline
        run: |
          MAX_LEDGER_VERSION=$(node -e "console.log(require('./supabase/qa/baseline/baseline.json').maxLedgerVersion)")
          EXPECTED=$(basename -a supabase/migrations/*.sql | sed -E 's/_.*$//' | sort -u | awk -v m="$MAX_LEDGER_VERSION" '$0 > m')
          ACTUAL=$(psql -Atc "select version from public.hub_migrations where version > '$MAX_LEDGER_VERSION' order by version" "$SUPABASE_DB_URL")
          echo "baseline maxLedgerVersion: $MAX_LEDGER_VERSION"
          echo "expected applied (migration files newer than the baseline):"
          echo "$EXPECTED"
          echo "actually applied (hub_migrations ledger, newer than the baseline):"
          echo "$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "MISMATCH — the runner did not apply exactly the migrations newer than the baseline"
            exit 1
          fi

      # `supabase status -o env` prints KEY="value" lines (API_URL, DB_URL,
      # ANON_KEY, SERVICE_ROLE_KEY, …). Mask the two secrets before anything
      # else can print them, then export the four this job needs under the
      # app's own var names so every later step/`. env` write can use them.
      - name: Export Supabase connection env vars
        run: |
          supabase status --workdir . -o env > /tmp/supabase-status.env
          cat > /tmp/export-supabase-env.mjs <<'EOF'
          import { readFileSync, appendFileSync } from 'node:fs';
          const text = readFileSync('/tmp/supabase-status.env', 'utf8');
          const vars = {};
          for (const raw of text.split('\n')) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const eq = line.indexOf('=');
            if (eq === -1) continue;
            const key = line.slice(0, eq).trim();
            let value = line.slice(eq + 1).trim();
            if (
              (value.startsWith('"') && value.endsWith('"') && value.length >= 2) ||
              (value.startsWith("'") && value.endsWith("'") && value.length >= 2)
            ) {
              value = value.slice(1, -1);
            }
            vars[key] = value;
          }
          const required = ['API_URL', 'DB_URL', 'ANON_KEY', 'SERVICE_ROLE_KEY'];
          const missing = required.filter((k) => !vars[k]);
          if (missing.length > 0) {
            console.error(`supabase status -o env is missing ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`::add-mask::${vars.ANON_KEY}`);
          console.log(`::add-mask::${vars.SERVICE_ROLE_KEY}`);
          const lines = [
            `PUBLIC_SUPABASE_URL=${vars.API_URL}`,
            `PUBLIC_SUPABASE_ANON_KEY=${vars.ANON_KEY}`,
            `SUPABASE_SERVICE_ROLE_KEY=${vars.SERVICE_ROLE_KEY}`,
            `SUPABASE_DB_URL=${vars.DB_URL}`,
            '',
          ].join('\n');
          appendFileSync(process.env.GITHUB_ENV, lines);
          EOF
          bun /tmp/export-supabase-env.mjs
          rm -f /tmp/supabase-status.env /tmp/export-supabase-env.mjs

      - name: Apply libsql (drizzle) migrations for the app's SQLite-family DB
        run: TURSO_DB_URL=file:./data/qa/minion_hub.db bun src/server/run-migrations.ts

      - name: Seed the QA database
        run: bun run qa:seed

      # Reuses scripts/qa/seed/db.ts's own countAllSeededRows (the same
      # cheap row-count proxy seed.contract.test.ts's idempotency assertion
      # uses) rather than re-deriving it — ON CONFLICT means only a genuinely
      # NEW row moves this number. Written into the repo root (not /tmp) so
      # bun's node_modules resolution finds this repo's `postgres` package.
      - name: Seed idempotency check — second run must change zero rows
        run: |
          SCRIPT=$(mktemp ./ci-seed-idempotency-XXXXXX.mjs)
          cat > "$SCRIPT" <<'EOF'
          import { execSync } from 'node:child_process';
          import postgresFactory from 'postgres';
          const { countAllSeededRows } = await import('./scripts/qa/seed/db.ts');

          const sql = postgresFactory(process.env.SUPABASE_DB_URL, { prepare: false, max: 1 });
          const before = await countAllSeededRows(sql);
          console.log(`[seed-idempotency] rows before second run: ${before}`);
          execSync('bun run qa:seed', { stdio: 'inherit' });
          const after = await countAllSeededRows(sql);
          console.log(`[seed-idempotency] rows after second run: ${after}`);
          await sql.end({ timeout: 5 });
          if (before !== after) {
            console.error(`seed is NOT idempotent: before=${before} after=${after}`);
            process.exit(1);
          }
          console.log('seed idempotency check OK — second run changed 0 rows');
          EOF
          bun "$SCRIPT"
          rm -f "$SCRIPT"

      - name: Seed contract test
        env:
          HUB_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54422/postgres
        run: bun run qa:seed:verify

      - name: Schema drift check (Drizzle declarations vs the live catalog)
        run: bun scripts/schema-drift-check.ts

      # Overwrites the placeholder .env from the earlier i18n step: keep every
      # .env.example default (so nothing unrelated fails to import) except the
      # handful of keys the QA stack must control — the loopback Supabase/
      # libsql values just exported above, never anything pointing at prod.
      - name: Write the QA .env for build + smoke test
        run: |
          grep -vE '^(SUPABASE_DB_URL|PUBLIC_SUPABASE_URL|PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|AUTH_PROVIDER|PUBLIC_AUTH_PROVIDER|TURSO_DB_URL|PUBLIC_POSTHOG_HOST|PUBLIC_POSTHOG_KEY|PUBLIC_DEFAULT_ORG_SLUG)=' \
            .env.example > .env
          cat >> .env <<EOF
          # --- QA stack overrides (written by CI qa-stack job; loopback only, never prod) ---
          PUBLIC_SUPABASE_URL=$PUBLIC_SUPABASE_URL
          PUBLIC_SUPABASE_ANON_KEY=$PUBLIC_SUPABASE_ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
          SUPABASE_DB_URL=$SUPABASE_DB_URL
          AUTH_PROVIDER=supabase
          PUBLIC_AUTH_PROVIDER=supabase
          TURSO_DB_URL=file:./data/qa/minion_hub.db
          PUBLIC_POSTHOG_HOST=https://posthog.invalid
          PUBLIC_POSTHOG_KEY=ci
          PUBLIC_DEFAULT_ORG_SLUG=faces-sculptors
          EOF

      - name: Build
        run: bun run build

      # svelte.config.js selects adapter-vercel unless DESKTOP=1, so `bun run
      # build` has no runnable `node build` output here (spec item note: use
      # the dev-server fallback). `--strictPort` makes a stuck previous
      # process fail loud instead of silently shifting ports.
      - name: Start the app (vite dev) for the smoke test
        run: |
          NODE_OPTIONS=--max-old-space-size=2048 \
            bun run dev -- --host 127.0.0.1 --port 5199 --strictPort \
            > /tmp/hub-qa-dev.log 2>&1 &
          echo $! > /tmp/hub-qa-dev.pid
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:5199/en/login; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "app never became ready on :5199 — last 200 lines of its log:"
          tail -n 200 /tmp/hub-qa-dev.log || true
          exit 1

      # No /api/health route exists in this codebase (checked — only
      # /api/metrics/credential-health). /api/me is the substitute: a real
      # GET endpoint gated by requireAuth() (src/server/auth/authorize.ts),
      # so an unauthenticated request is the same 401 proof /api/health would
      # have given.
      - name: Smoke test — /en/login 200, /api/me 401 (unauthenticated)
        run: |
          LOGIN_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5199/en/login)
          ME_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5199/api/me)
          echo "GET /en/login -> $LOGIN_CODE (want 200)"
          echo "GET /api/me   -> $ME_CODE (want 401, unauthenticated)"
          if [ "$LOGIN_CODE" != "200" ] || [ "$ME_CODE" != "401" ]; then
            echo "smoke test failed — last 200 lines of the app log:"
            tail -n 200 /tmp/hub-qa-dev.log || true
            exit 1
          fi

      - name: Stop the app
        if: always()
        run: kill "$(cat /tmp/hub-qa-dev.pid)" 2>/dev/null || true

      - name: Stop the Supabase QA stack
        if: always()
        run: supabase stop --workdir . --no-backup

  check-and-build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_DEFAULT_ORG_SLUG: ci
      PUBLIC_POSTHOG_HOST: https://posthog.invalid
      PUBLIC_POSTHOG_KEY: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Svelte environment and translations
        run: |
          cp .env.example .env
          bun run i18n:compile

      - name: Svelte check + typecheck
        run: bun run check

      - name: Design token integrity
        run: bun run lint:tokens:ci

      - name: Design lint ratchet (changed files)
        env:
          DESIGN_LINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$DESIGN_LINT_BASE_REF" || "$DESIGN_LINT_BASE_REF" =~ ^0+$ ]]; then
            export DESIGN_LINT_BASE_REF="$(git rev-parse HEAD^)"
          fi
          bun run lint:design:ci

      - name: Prettier check (changed files)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -d '' files < <(git diff -z --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- \
            '*.css' '*.js' '*.json' '*.md' '*.svelte' '*.ts' '*.yaml' '*.yml')
          if (( ${#files[@]} > 0 )); then
            bunx prettier --plugin=prettier-plugin-svelte --check -- "${files[@]}"
          fi

      - name: Build
        run: bun run build
