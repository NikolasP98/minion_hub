# Publishes the component workbench to Cloudflare Pages (project `minion-components`,
# served at https://components.minion-ai.org behind Cloudflare Access).
# Secrets: CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
name: storybook-deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: storybook-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build Storybook
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build-storybook

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy storybook-static --project-name=minion-components --branch=main
