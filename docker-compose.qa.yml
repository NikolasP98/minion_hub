# Hub local QA stack — app container only (Postgres/GoTrue/Kong are managed
# separately by `supabase start`, project "minion-hub-qa", spec §2).
# See specs/2026-09-16-hub-local-qa-stack-spec.md and docs/qa-stack.md.
#
# Networking: `network_mode: host` instead of joining the Supabase project's
# bridge network. The app's Supabase clients (src/lib/supabase/client.ts,
# src/server/supabase.ts) both read PUBLIC_SUPABASE_URL — there is no
# server-only URL var to point at an in-network Kong hostname. Host
# networking makes the container see the same 127.0.0.1:54421/54422 the
# browser and the CLI use, so one URL works everywhere and no code change or
# extra env var was needed. Trade-off: `ports:` below is inert under host
# networking (kept only as documentation of the port this binds); on a
# non-Linux Docker host (Docker Desktop) host networking does not forward
# loopback the same way — this compose file is Linux-only, matching the spec.
name: hub-qa
services:
  hub:
    image: oven/bun:1
    working_dir: /app
    network_mode: host
    volumes:
      - .:/app
    command: ['bash', '/app/scripts/qa/hub-entrypoint.sh']
    env_file: .env.qa
    environment:
      NODE_OPTIONS: --max-old-space-size=2048
    ports:
      - '127.0.0.1:5199:5199' # inert under network_mode: host; documents the bound port
    mem_limit: 3g
    stop_grace_period: 10s
    restart: 'no'
    healthcheck:
      # No curl/wget in oven/bun:1 — use bun's own fetch instead of adding a package.
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:5199/en/login').then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ── Local Minion gateway (opt-in) ──────────────────────────────────────────
  # Started ONLY by `dev:local --gateway` / `qa:up --gateway`, via compose
  # profile "gateway" — the default QA path cannot bring it up.
  # Spec: meta-repo specs/011-dev-local-gateway-mode/. Control: scripts/qa/gateway.ts.
  #
  # `network_mode: host` for the same reason the `hub` service above uses it:
  # the browser dials ws://127.0.0.1:18789 and the gateway calls the host dev
  # server back on http://127.0.0.1:5199, with one address that works for
  # browser, container and CLI alike. Linux-only, as documented at the top.
  #
  # `.env.qa.gateway` is written by scripts/qa/gateway.ts (mode 600) and is the
  # ONE place a developer-held secret (a model-provider key) enters this stack.
  minion-gateway:
    profiles: ['gateway']
    image: ${MINION_GATEWAY_IMAGE:-ghcr.io/nikolasp98/minion-ai:dev}
    network_mode: host
    env_file: .env.qa.gateway
    volumes:
      # The gateway's whole state dir: minion.json (pre-written with
      # gateway.hubMetrics before first boot) plus agent workspaces.
      - ./data/qa/gateway:/home/node/.minion
    ports:
      - '127.0.0.1:18789:18789' # inert under network_mode: host; documents the bound port
    init: true
    mem_limit: 2g
    stop_grace_period: 10s
    restart: 'no'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:18789/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
