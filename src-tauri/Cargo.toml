[package]
name = "minion-hub-desktop"
version = "0.0.2"
description = "Minion Hub desktop shell (Tauri v2)"
authors = ["Minion Stack"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "minion_hub_desktop_lib"
# Desktop distribution does not need the mobile static/dynamic library outputs.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# deep-link 2.6.2 uses the rust-ini 0.21.1 ParseOption shape.
# Keep Cargo.lock: rust-ini 0.21.2/0.21.3 add required fields upstream.
tauri-plugin-deep-link = "2"
rust-ini = "=0.21.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
