[package]
name = "minion-hub-desktop"
version = "0.0.1"
description = "Minion Hub desktop shell (Tauri v2)"
authors = ["Minion Stack"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "minion_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# deep-link 2.6.2 uses the rust-ini 0.21.1 ParseOption shape.
# Keep Cargo.lock: rust-ini 0.21.2/0.21.3 add required fields upstream.
tauri-plugin-deep-link = "2"
rust-ini = "=0.21.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
